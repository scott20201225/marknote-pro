packages:
  - 'packages/*'
  - 'packages/desktop/src/githubDesktop/upstream/vendor/desktop-trampoline'
  - 'packages/desktop/src/githubDesktop/upstream/vendor/windows-argv-parser'
  # muya v2 (TS) nests its dev surface and Playwright suite inside its own
  # package directory rather than as siblings under packages/, so list them
  # explicitly.
  - 'packages/muya/examples'
  - 'packages/muya/e2e'

overrides:
  postcss: 8.5.15
  'esbuild@>=0.27.0 <0.28.1': 0.28.1

allowBuilds:
  desktop-trampoline: true
  windows-argv-parser: true
  '@parcel/watcher': true
  ced: true
  dugite: true
  electron-winstaller: true
  esbuild: true
  fs-admin: true
  keytar: true
  koffi: true
  native-keymap: true
  process-proxy: true
  registry-js: true
  sharp: true
  unrs-resolver: true
  workerd: true
