<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
  <link rel="icon" href="dist/logo.ico">
  <title>思维导图 - MarkNotePro</title>
  <script>
    // 自定义静态资源的路径
    window.externalPublicPath = './dist/'
    // 接管应用
    window.takeOverApp = true
  </script>
  <link href="dist/css/chunk-vendors.css?720fe4d863ea0fdcc0fb" rel="stylesheet">
  <link href="dist/css/app.css?720fe4d863ea0fdcc0fb" rel="stylesheet">
  <style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }
    /* 隐藏与桌面宿主文件/目录管理冲突的纯前端独立按钮 */
    .toolbarBlock:nth-child(2) > .toolbarBtn:nth-child(1), /* 目录 */
    .toolbarBlock:nth-child(2) > .el-tooltip:nth-child(2), /* 新建文件 */
    .toolbarBlock:nth-child(2) > .el-tooltip:nth-child(3)  /* 打开文件 */
    {
      display: none !important;
    }
  </style>
</head>
<body>
  <noscript><strong>We're sorry but thoughts doesn't work properly without JavaScript enabled. Please enable it to continue.</strong></noscript>
  <div id="app"></div>
  <script>
    let currentMindMapData = null
    let currentConfig = {}
    let currentLang = 'zh'
    let currentLocalConfig = { isDark: false }
    let currentMindMapTheme = ''
    let currentBackgroundColor = ''
    let hasInitedApp = false

    const DEFAULT_DATA = {
      root: {
        data: {
          text: '中心主题'
        },
        children: []
      },
      theme: {
        template: 'classic4',
        config: {}
      },
      layout: 'logicalStructure',
      config: {},
      view: null
    }

    const applyLocalConfig = (config) => {
      if (!config) return
      currentLocalConfig = { ...currentLocalConfig, ...config }
      if (window.__vueApp && window.__vueApp.$store) {
        window.__vueApp.$store.commit('setLocalConfig', config)
      } else {
        const appEl = document.getElementById('app') || document.querySelector('.container')
        if (appEl && appEl.__vue__ && appEl.__vue__.$store) {
          appEl.__vue__.$store.commit('setLocalConfig', config)
        }
      }
      if (typeof config?.isDark === 'boolean') {
        document.body.classList.toggle('isDark', config.isDark)
      }
    }

    const applyMindMapTheme = (mindMapTheme, backgroundColor) => {
      if (mindMapTheme) currentMindMapTheme = mindMapTheme
      if (backgroundColor) currentBackgroundColor = backgroundColor

      if (currentBackgroundColor) {
        document.documentElement.style.backgroundColor = currentBackgroundColor
        document.body.style.backgroundColor = currentBackgroundColor
      }

      if (window.__mindMap) {
        const hasTheme = !!currentMindMapTheme && typeof window.__mindMap.setTheme === 'function'
        const hasBg = !!currentBackgroundColor && typeof window.__mindMap.setThemeConfig === 'function'

        if (hasTheme && window.__mindMap.getTheme() !== currentMindMapTheme) {
          window.__mindMap.setTheme(currentMindMapTheme, hasBg)
        }

        if (hasBg) {
          const currentCustom = typeof window.__mindMap.getCustomThemeConfig === 'function'
            ? (window.__mindMap.getCustomThemeConfig() || {})
            : {}
          window.__mindMap.setThemeConfig({
            ...currentCustom,
            backgroundColor: currentBackgroundColor
          })
        } else if (hasTheme && typeof window.__mindMap.render === 'function') {
          window.__mindMap.render()
        }
      }
    }

    window.takeOverAppMethods = {
      getMindMapData: () => {
        return currentMindMapData || DEFAULT_DATA
      },
      saveMindMapData: (data) => {
        currentMindMapData = data
        if (window.electron && window.electron.ipcRenderer) {
          window.electron.ipcRenderer.send('mt::mindmap::state', { modified: true, data })
        }
      },
      getMindMapConfig: () => currentConfig,
      saveMindMapConfig: (config) => {
        currentConfig = config
      },
      getLanguage: () => currentLang,
      saveLanguage: (lang) => {
        currentLang = lang
      },
      getLocalConfig: () => currentLocalConfig,
      saveLocalConfig: (config) => {
        currentLocalConfig = { ...currentLocalConfig, ...config }
      }
    }

    const initOrUpdate = (payload) => {
      if (!payload) return
      if (payload.data) currentMindMapData = payload.data
      if (payload.language) currentLang = payload.language
      if (typeof payload.isDark === 'boolean') {
        currentLocalConfig.isDark = payload.isDark
        applyLocalConfig({ isDark: payload.isDark })
      }
      if (payload.mindMapTheme) currentMindMapTheme = payload.mindMapTheme
      if (payload.backgroundColor) currentBackgroundColor = payload.backgroundColor

      if (currentMindMapData) {
        if (!currentMindMapData.theme) {
          currentMindMapData.theme = { template: currentMindMapTheme || 'classic4', config: {} }
        }
        if (currentMindMapTheme) {
          currentMindMapData.theme.template = currentMindMapTheme
        }
        if (currentBackgroundColor) {
          currentMindMapData.theme.config = {
            ...(currentMindMapData.theme.config || {}),
            backgroundColor: currentBackgroundColor
          }
        }
      }

      if (currentBackgroundColor) {
        document.documentElement.style.backgroundColor = currentBackgroundColor
        document.body.style.backgroundColor = currentBackgroundColor
      }

      if (!hasInitedApp) {
        hasInitedApp = true
        if (typeof window.initApp === 'function') {
          const app = window.initApp()
          if (app) window.__vueApp = app
        }
      } else if (window.$bus && currentMindMapData) {
        window.$bus.$emit('setData', currentMindMapData)
      }

      applyMindMapTheme(currentMindMapTheme, currentBackgroundColor)
    }

    if (window.electron && window.electron.ipcRenderer) {
      window.electron.ipcRenderer.on('mt::mindmap::init', (_event, payload) => {
        initOrUpdate(payload)
      })

      window.electron.ipcRenderer.on('mt::mindmap::set-theme', (_event, payload) => {
        if (!payload) return
        if (typeof payload.isDark === 'boolean') {
          currentLocalConfig.isDark = payload.isDark
          applyLocalConfig({ isDark: payload.isDark })
          if (window.$bus) {
            window.$bus.$emit('setLocalConfig', { isDark: payload.isDark })
          }
        }
        applyMindMapTheme(payload.mindMapTheme, payload.backgroundColor)
        if (currentMindMapData) {
          if (!currentMindMapData.theme) {
            currentMindMapData.theme = { template: payload.mindMapTheme || 'classic4', config: {} }
          }
          if (payload.mindMapTheme) {
            currentMindMapData.theme.template = payload.mindMapTheme
          }
          if (payload.backgroundColor) {
            currentMindMapData.theme.config = {
              ...(currentMindMapData.theme.config || {}),
              backgroundColor: payload.backgroundColor
            }
          }
        }
      })

      window.electron.ipcRenderer.on('mt::mindmap::request-save', () => {
        let fullData = currentMindMapData
        if (window.__mindMap && typeof window.__mindMap.getData === 'function') {
          fullData = window.__mindMap.getData(true)
        }
        window.electron.ipcRenderer.invoke('mt::mindmap::save', fullData)
      })
    }

    window.onload = () => {
      if (window.$bus) {
        window.$bus.$on('app_inited', (mindMap) => {
          window.__mindMap = mindMap
          if (currentMindMapTheme || currentBackgroundColor) {
            applyMindMapTheme(currentMindMapTheme, currentBackgroundColor)
          }
        })
        window.$bus.$on('setLocalConfig', (config) => {
          applyLocalConfig(config)
        })
      }
      if (window.electron && window.electron.ipcRenderer) {
        window.electron.ipcRenderer.invoke('mt::mindmap::ready').then((payload) => {
          if (payload) initOrUpdate(payload)
        }).catch(() => {})
      } else {
        // Standalone fallback
        if (!hasInitedApp && typeof window.initApp === 'function') {
          hasInitedApp = true
          const app = window.initApp()
          if (app) window.__vueApp = app
        }
      }
    }
  </script>
  <script src="dist/js/chunk-vendors.js?720fe4d863ea0fdcc0fb"></script>
  <script src="dist/js/app.js?720fe4d863ea0fdcc0fb"></script>
  <script>
    if (typeof window.initApp === 'function') {
      const rawInitApp = window.initApp
      window.initApp = function() {
        const app = rawInitApp.apply(this, arguments)
        if (app) window.__vueApp = app
        return app
      }
    }
  </script>
</body>
</html>
