<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
  <link rel="icon" href="dist/logo.ico">
  <title>思维导图 - MarkNotePro</title>
  <script>
    // 自定义静态资源的路径
    window.externalPublicPath = './dist/'
    // 接管应用
    window.takeOverApp = true
  </script>
  <link href="dist/css/chunk-vendors.css?720fe4d863ea0fdcc0fb" rel="stylesheet">
  <link href="dist/css/app.css?720fe4d863ea0fdcc0fb" rel="stylesheet">
  <style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }
    /* 隐藏与桌面宿主文件/目录管理冲突的纯前端独立按钮 */
    .toolbarBlock:nth-child(2) > .toolbarBtn:nth-child(1), /* 目录 */
    .toolbarBlock:nth-child(2) > .el-tooltip:nth-child(2), /* 新建文件 */
    .toolbarBlock:nth-child(2) > .el-tooltip:nth-child(3)  /* 打开文件 */
    {
      display: none !important;
    }
    /* 主题侧边栏预览卡片背景及边框美化 */
    .themeGroupList .themeListTheme .themeItem .imgBox {
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .themeGroupList .themeListTheme .themeItem .imgBox img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .themeGroupList.isDark .themeItem {
      border-bottom-color: rgba(255, 255, 255, 0.08) !important;
    }
    .themeGroupList.isDark .name {
      color: #e0e0e0 !important;
    }
  </style>
</head>
<body>
  <noscript><strong>We're sorry but thoughts doesn't work properly without JavaScript enabled. Please enable it to continue.</strong></noscript>
  <div id="app"></div>
  <script>
    let currentMindMapData = null
    let currentConfig = {}
    let currentLang = 'zh'
    let currentLocalConfig = { isDark: false }
    let currentMindMapTheme = ''
    let currentBackgroundColor = ''
    let currentThemeConfig = null
    let isCustomTheme = false
    let customThemeIsDark = null
    let lastIsDark = null
    let hasInitedApp = false
    let isInitialLoading = true
    let notifyModifiedTimer = null

    const notifyModified = () => {
      if (isInitialLoading) return
      if (notifyModifiedTimer) clearTimeout(notifyModifiedTimer)
      notifyModifiedTimer = setTimeout(() => {
        if (window.electron && window.electron.ipcRenderer) {
          window.electron.ipcRenderer.send('mt::mindmap::state', { modified: true })
        }
      }, 100)
    }

    const DEFAULT_DATA = {
      root: {
        data: {
          text: '中心主题'
        },
        children: []
      },
      theme: {
        template: 'classic4',
        config: {}
      },
      layout: 'logicalStructure',
      config: {},
      view: null
    }

    const patchMindMap = (mindMap) => {
      if (!mindMap) return
      if (mindMap.constructor && mindMap.constructor.prototype && !mindMap.constructor.__marknotepro_proto_patched) {
        mindMap.constructor.__marknotepro_proto_patched = true
        const protoInitTheme = mindMap.constructor.prototype.initTheme
        mindMap.constructor.prototype.initTheme = function() {
          if (typeof protoInitTheme === 'function') {
            protoInitTheme.apply(this, arguments)
          }
          const bg = currentBackgroundColor || window.__currentBackgroundColor
          if (bg) {
            if (this.themeConfig) this.themeConfig.backgroundColor = bg
            if (this.el) this.el.style.backgroundColor = bg
          }
          if (this.themeConfig) {
            this.themeConfig.backgroundImage = 'none'
            this.themeConfig.backgroundRepeat = 'no-repeat'
          }
          if (this.el) {
            this.el.style.backgroundImage = 'none'
          }
        }
      }
      if (!mindMap.__marknotepro_patched) {
        mindMap.__marknotepro_patched = true
        const origInitTheme = mindMap.initTheme
        mindMap.initTheme = function() {
          if (typeof origInitTheme === 'function') {
            origInitTheme.apply(this, arguments)
          }
          const bg = currentBackgroundColor || window.__currentBackgroundColor
          if (bg) {
            if (this.themeConfig) this.themeConfig.backgroundColor = bg
            if (this.el) this.el.style.backgroundColor = bg
          }
          if (this.themeConfig) {
            this.themeConfig.backgroundImage = 'none'
            this.themeConfig.backgroundRepeat = 'no-repeat'
          }
          if (this.el) {
            this.el.style.backgroundImage = 'none'
          }
        }
      }
    }

    const applyLocalConfig = (config) => {
      if (!config) return
      currentLocalConfig = { ...currentLocalConfig, ...config }
      if (window.__vueApp && window.__vueApp.$store) {
        window.__vueApp.$store.commit('setLocalConfig', config)
      } else {
        const appEl = document.getElementById('app') || document.querySelector('.container')
        if (appEl && appEl.__vue__ && appEl.__vue__.$store) {
          appEl.__vue__.$store.commit('setLocalConfig', config)
        }
      }
      if (typeof config?.isDark === 'boolean') {
        document.body.classList.toggle('isDark', config.isDark)
      }
    }

    const applyMindMapTheme = (mindMapTheme, backgroundColor, themeConfig) => {
      if (mindMapTheme) currentMindMapTheme = mindMapTheme
      if (backgroundColor) {
        currentBackgroundColor = backgroundColor
        window.__currentBackgroundColor = backgroundColor
      }
      if (themeConfig !== undefined) currentThemeConfig = themeConfig

      if (currentBackgroundColor) {
        document.documentElement.style.backgroundColor = currentBackgroundColor
        document.body.style.backgroundColor = currentBackgroundColor
      }

      if (window.__mindMap) {
        patchMindMap(window.__mindMap)
        const hasTheme = !!currentMindMapTheme && typeof window.__mindMap.setTheme === 'function'
        const hasCustomConfig =
          (!!currentBackgroundColor || !!currentThemeConfig) &&
          typeof window.__mindMap.setThemeConfig === 'function'

        const themeChanged = hasTheme && window.__mindMap.getTheme() !== currentMindMapTheme

        if (themeChanged) {
          window.__mindMap.setTheme(currentMindMapTheme, hasCustomConfig)
        }

        if (hasCustomConfig) {
          const mergedConfig = {
            ...(currentThemeConfig || {}),
            backgroundImage: 'none',
            backgroundRepeat: 'no-repeat'
          }
          if (currentBackgroundColor) {
            mergedConfig.backgroundColor = currentBackgroundColor
          }
          window.__mindMap.setThemeConfig(mergedConfig)
        } else if (themeChanged && typeof window.__mindMap.render === 'function') {
          window.__mindMap.render()
        }

        if (window.__mindMap.el) {
          if (currentBackgroundColor) {
            window.__mindMap.el.style.backgroundColor = currentBackgroundColor
          }
          window.__mindMap.el.style.backgroundImage = 'none'
        }
        if (window.__mindMap.themeConfig) {
          if (currentBackgroundColor) {
            window.__mindMap.themeConfig.backgroundColor = currentBackgroundColor
          }
          window.__mindMap.themeConfig.backgroundImage = 'none'
          window.__mindMap.themeConfig.backgroundRepeat = 'no-repeat'
        }
      }
    }

    window.takeOverAppMethods = {
      getMindMapData: () => {
        return currentMindMapData || DEFAULT_DATA
      },
      saveMindMapData: (data) => {
        try {
          currentMindMapData = data
          if (isCustomTheme && currentMindMapData) {
            if (!currentMindMapData.theme) currentMindMapData.theme = {}
            currentMindMapData.theme._isCustomTheme = true
            currentMindMapData.theme._customThemeIsDark = customThemeIsDark
            if (!currentMindMapData.theme.config) currentMindMapData.theme.config = {}
            currentMindMapData.theme.config._isCustomTheme = true
            currentMindMapData.theme.config._customThemeIsDark = customThemeIsDark
            if (currentBackgroundColor) {
              currentMindMapData.theme.config.backgroundColor = currentBackgroundColor
              currentMindMapData.theme.config.backgroundImage = 'none'
            }
          } else if (!isCustomTheme && currentMindMapData?.theme) {
            delete currentMindMapData.theme._isCustomTheme
            delete currentMindMapData.theme._customThemeIsDark
            if (currentMindMapData.theme.config) {
              delete currentMindMapData.theme.config._isCustomTheme
              delete currentMindMapData.theme.config._customThemeIsDark
            }
          }
          notifyModified()
        } catch (e) {
          console.warn('[MarkNotePro] saveMindMapData error:', e)
        }
      },
      getMindMapConfig: () => currentConfig,
      saveMindMapConfig: (config) => {
        currentConfig = config
      },
      getLanguage: () => currentLang,
      saveLanguage: (lang) => {
        currentLang = lang
      },
      getLocalConfig: () => currentLocalConfig,
      saveLocalConfig: (config) => {
        currentLocalConfig = { ...currentLocalConfig, ...config }
      }
    }

    const initOrUpdate = (payload) => {
      if (!payload) return
      if (payload.data) currentMindMapData = payload.data
      if (payload.language) currentLang = payload.language

      const isDarkBool = typeof payload.isDark === 'boolean' ? payload.isDark : false
      lastIsDark = isDarkBool
      currentLocalConfig.isDark = isDarkBool
      applyLocalConfig({ isDark: isDarkBool })

      if (payload.backgroundColor) {
        currentBackgroundColor = payload.backgroundColor
        window.__currentBackgroundColor = payload.backgroundColor
        if (typeof window.__updateThemeImages === 'function') {
          window.__updateThemeImages()
        }
      }

      // 检查文件内部是否保存了定制主题信息
      const savedTheme = currentMindMapData?.theme
      const savedIsCustom = !!(savedTheme?._isCustomTheme || savedTheme?.config?._isCustomTheme)
      const savedCustomIsDark = savedTheme?._customThemeIsDark ?? savedTheme?.config?._customThemeIsDark

      if (savedIsCustom && savedCustomIsDark === isDarkBool) {
        // 定制主题存在，且深浅主模式一致 -> 定制主题生效！
        isCustomTheme = true
        customThemeIsDark = savedCustomIsDark
        currentMindMapTheme = savedTheme.template || payload.mindMapTheme || 'classic4'
        currentThemeConfig = {
          ...(savedTheme.config || {}),
          backgroundColor: currentBackgroundColor,
          backgroundImage: 'none',
          _isCustomTheme: true,
          _customThemeIsDark: customThemeIsDark
        }
      } else if (savedIsCustom && savedCustomIsDark !== isDarkBool) {
        // 深浅模式变动了 -> 定制主题失效，恢复主题默认
        isCustomTheme = false
        customThemeIsDark = null
        if (savedTheme) {
          delete savedTheme._isCustomTheme
          delete savedTheme._customThemeIsDark
          if (savedTheme.config) {
            delete savedTheme.config._isCustomTheme
            delete savedTheme.config._customThemeIsDark
          }
        }
        currentMindMapTheme = payload.mindMapTheme || 'classic4'
        currentThemeConfig = payload.themeConfig || null
      } else {
        // 未定制主题 -> 正常走默认联动
        isCustomTheme = false
        customThemeIsDark = null
        currentMindMapTheme = payload.mindMapTheme || 'classic4'
        currentThemeConfig = payload.themeConfig || null
      }

      window.__isCustomTheme = isCustomTheme
      window.__customThemeIsDark = customThemeIsDark

      if (currentMindMapData) {
        if (!currentMindMapData.theme) {
          currentMindMapData.theme = { template: currentMindMapTheme, config: {} }
        }
        currentMindMapData.theme.template = currentMindMapTheme
        currentMindMapData.theme.config = {
          ...(currentMindMapData.theme.config || {}),
          ...(currentThemeConfig || {})
        }
        if (currentBackgroundColor) {
          currentMindMapData.theme.config.backgroundColor = currentBackgroundColor
          currentMindMapData.theme.config.backgroundImage = 'none'
        }
        if (isCustomTheme) {
          currentMindMapData.theme._isCustomTheme = true
          currentMindMapData.theme._customThemeIsDark = customThemeIsDark
          currentMindMapData.theme.config._isCustomTheme = true
          currentMindMapData.theme.config._customThemeIsDark = customThemeIsDark
        }
      }

      if (currentBackgroundColor) {
        document.documentElement.style.backgroundColor = currentBackgroundColor
        document.body.style.backgroundColor = currentBackgroundColor
      }

      if (!hasInitedApp) {
        hasInitedApp = true
        if (typeof window.initApp === 'function') {
          const app = window.initApp()
          if (app) window.__vueApp = app
        }
      } else if (window.$bus && currentMindMapData) {
        window.$bus.$emit('setData', currentMindMapData)
      }

      applyMindMapTheme(currentMindMapTheme, currentBackgroundColor, currentThemeConfig)
    }

    if (window.electron && window.electron.ipcRenderer) {
      window.electron.ipcRenderer.on('mt::mindmap::init', (_event, payload) => {
        initOrUpdate(payload)
      })

      window.electron.ipcRenderer.on('mt::mindmap::set-theme', (_event, payload) => {
        if (!payload) return
        const isDarkBool = typeof payload.isDark === 'boolean' ? payload.isDark : false
        const darkChanged = lastIsDark !== null && lastIsDark !== isDarkBool
        lastIsDark = isDarkBool

        if (payload.backgroundColor) {
          currentBackgroundColor = payload.backgroundColor
          window.__currentBackgroundColor = payload.backgroundColor
          if (typeof window.__updateThemeImages === 'function') {
            window.__updateThemeImages()
          }
        }

        if (isDarkBool !== currentLocalConfig.isDark) {
          currentLocalConfig.isDark = isDarkBool
          applyLocalConfig({ isDark: isDarkBool })
          if (window.$bus) {
            window.$bus.$emit('setLocalConfig', { isDark: isDarkBool })
          }
        }

        if (darkChanged) {
          // 深浅模式发生跨界变动！
          // 用户规则：“如果变动深、浅模式，则定制主题恢复主题默认”
          isCustomTheme = false
          customThemeIsDark = null

          if (currentMindMapData?.theme) {
            delete currentMindMapData.theme._isCustomTheme
            delete currentMindMapData.theme._customThemeIsDark
            if (currentMindMapData.theme.config) {
              delete currentMindMapData.theme.config._isCustomTheme
              delete currentMindMapData.theme.config._customThemeIsDark
            }
          }

          currentMindMapTheme = payload.mindMapTheme || ''
          currentThemeConfig = payload.themeConfig || null
          applyMindMapTheme(currentMindMapTheme, currentBackgroundColor, currentThemeConfig)
        } else if (isCustomTheme) {
          // 深浅模式未变动，且处于定制主题生效状态！
          // 用户规则：“当定制主题生效的时候，后续marknote主题变动，但不变动深、浅两种主逻辑，定制主题样式不变，只变背景。”
          currentThemeConfig = {
            ...(currentThemeConfig || {}),
            backgroundColor: currentBackgroundColor,
            backgroundImage: 'none',
            _isCustomTheme: true,
            _customThemeIsDark: customThemeIsDark
          }
          applyMindMapTheme(currentMindMapTheme, currentBackgroundColor, currentThemeConfig)
        } else {
          // 未定制，且深浅未变（同色系默认联动切换）
          currentMindMapTheme = payload.mindMapTheme || ''
          currentThemeConfig = payload.themeConfig || null
          applyMindMapTheme(currentMindMapTheme, currentBackgroundColor, currentThemeConfig)
        }

        window.__isCustomTheme = isCustomTheme
        window.__customThemeIsDark = customThemeIsDark

        // 同步更新 currentMindMapData
        if (currentMindMapData) {
          if (!currentMindMapData.theme) {
            currentMindMapData.theme = { template: currentMindMapTheme || 'classic4', config: {} }
          }
          currentMindMapData.theme.template = currentMindMapTheme
          currentMindMapData.theme.config = {
            ...(currentMindMapData.theme.config || {}),
            backgroundColor: currentBackgroundColor,
            backgroundImage: 'none'
          }
          if (isCustomTheme) {
            currentMindMapData.theme._isCustomTheme = true
            currentMindMapData.theme._customThemeIsDark = customThemeIsDark
            currentMindMapData.theme.config._isCustomTheme = true
            currentMindMapData.theme.config._customThemeIsDark = customThemeIsDark
          } else {
            delete currentMindMapData.theme._isCustomTheme
            delete currentMindMapData.theme._customThemeIsDark
            if (currentMindMapData.theme.config) {
              delete currentMindMapData.theme.config._isCustomTheme
              delete currentMindMapData.theme.config._customThemeIsDark
            }
          }
        }
      })

      window.electron.ipcRenderer.on('mt::mindmap::request-save', () => {
        let fullData = currentMindMapData
        if (window.__mindMap && typeof window.__mindMap.getData === 'function') {
          fullData = window.__mindMap.getData(true)
        }
        if (isCustomTheme && fullData) {
          if (!fullData.theme) fullData.theme = {}
          fullData.theme._isCustomTheme = true
          fullData.theme._customThemeIsDark = customThemeIsDark
          if (!fullData.theme.config) fullData.theme.config = {}
          fullData.theme.config._isCustomTheme = true
          fullData.theme.config._customThemeIsDark = customThemeIsDark
          if (currentBackgroundColor) {
            fullData.theme.config.backgroundColor = currentBackgroundColor
            fullData.theme.config.backgroundImage = 'none'
          }
        } else if (!isCustomTheme && fullData?.theme) {
          delete fullData.theme._isCustomTheme
          delete fullData.theme._customThemeIsDark
          if (fullData.theme.config) {
            delete fullData.theme.config._isCustomTheme
            delete fullData.theme.config._customThemeIsDark
          }
        }
        window.electron.ipcRenderer.invoke('mt::mindmap::save', fullData)
      })
    }

    window.onload = () => {
      if (window.$bus) {
        const origBusEmit = window.$bus.$emit
        window.$bus.$emit = function(event, ...args) {
          if (event === 'localStorageExceeded') {
            console.warn('[MarkNotePro] Silenced localStorageExceeded on $bus')
            return
          }
          return origBusEmit.apply(this, arguments)
        }

        window.$bus.$on('app_inited', (mindMap) => {
          window.__mindMap = mindMap
          patchMindMap(mindMap)
          if (currentMindMapTheme || currentBackgroundColor || currentThemeConfig) {
            applyMindMapTheme(currentMindMapTheme, currentBackgroundColor, currentThemeConfig)
          }
          mindMap.on('data_change', () => {
            notifyModified()
          })
          mindMap.on('view_theme_change', () => {
            notifyModified()
          })
          setTimeout(() => {
            isInitialLoading = false
          }, 800)
        })

        window.$bus.$on('data_change', () => {
          notifyModified()
        })

        window.$bus.$on('marknotepro::custom_theme_chosen', ({ template, isDark, config }) => {
          isCustomTheme = true
          customThemeIsDark = isDark
          window.__isCustomTheme = true
          window.__customThemeIsDark = isDark
          currentMindMapTheme = template
          currentThemeConfig = config
          if (currentMindMapData) {
            if (!currentMindMapData.theme) currentMindMapData.theme = {}
            currentMindMapData.theme.template = template
            currentMindMapData.theme.config = config
            currentMindMapData.theme._isCustomTheme = true
            currentMindMapData.theme._customThemeIsDark = isDark
          }
          notifyModified()
        })

        window.$bus.$on('setLocalConfig', (config) => {
          applyLocalConfig(config)
        })
      }

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault()
          e.stopPropagation()
          if (window.electron && window.electron.ipcRenderer) {
            let fullData = currentMindMapData
            if (window.__mindMap && typeof window.__mindMap.getData === 'function') {
              fullData = window.__mindMap.getData(true)
            }
            if (isCustomTheme && fullData) {
              if (!fullData.theme) fullData.theme = {}
              fullData.theme._isCustomTheme = true
              fullData.theme._customThemeIsDark = customThemeIsDark
              if (!fullData.theme.config) fullData.theme.config = {}
              fullData.theme.config._isCustomTheme = true
              fullData.theme.config._customThemeIsDark = customThemeIsDark
              if (currentBackgroundColor) {
                fullData.theme.config.backgroundColor = currentBackgroundColor
                fullData.theme.config.backgroundImage = 'none'
              }
            }
            window.electron.ipcRenderer.invoke('mt::mindmap::save', fullData)
          }
        }
      }, true)

      if (window.electron && window.electron.ipcRenderer) {
        window.electron.ipcRenderer.invoke('mt::mindmap::ready').then((payload) => {
          if (payload) initOrUpdate(payload)
        }).catch(() => {})
      } else {
        // Standalone fallback
        if (!hasInitedApp && typeof window.initApp === 'function') {
          hasInitedApp = true
          const app = window.initApp()
          if (app) window.__vueApp = app
        }
      }
    }
  </script>

        '<circle cx="352" cy="98" r="8" fill="' + secondFill + '" stroke="' + lineColor + '" stroke-width="1.5"/>' +
        '<line x1="348" y1="98" x2="356" y2="98" stroke="' + lineColor + '" stroke-width="1.5" stroke-linecap="round"/>' +
        '<path d="M 360 98 C 382 98, 386 56, 408 56" fill="none" stroke="' + lineColor + '" stroke-width="' + subLineWidth + '" stroke-linecap="round"/>' +
        '<path d="M 360 98 C 382 98, 386 140, 408 140" fill="none" stroke="' + lineColor + '" stroke-width="' + subLineWidth + '" stroke-linecap="round"/>' +
        '<text x="418" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="' + nodeColor + '">子节点</text>' +
        '<text x="418" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="' + nodeColor + '">子节点</text>' +
      '</svg>'

      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg)
    }

        Vue.mixin({
          created() {
            if (typeof this.onLocalStorageExceeded === 'function') {
              this.onLocalStorageExceeded = function() {
                console.warn('[MarkNotePro] Blocked onLocalStorageExceeded notification')
              }
            }
            if (this.defaultGroupList !== undefined) {
              const vm = this
              window.__themeComponent = vm

              const updateAllThemePreviews = () => {
                const currentBg = window.__currentBackgroundColor || (vm.isDark ? '#1e1e1e' : '#ffffff')
                const allGroups = vm.allDefaultGroupList || vm.defaultGroupList || []
                allGroups.forEach(group => {
                  if (Array.isArray(group.list)) {
                    group.list.forEach(item => {
                      item.img = generateThemePreviewSvg(item.value, currentBg, vm.isDark)
                    })
                  }
                })
              }
              window.__updateThemeImages = () => {
                updateAllThemePreviews()
                vm.$forceUpdate()
              }

              const origInitGroup = vm.initGroup
              vm.initGroup = function() {
                if (typeof origInitGroup === 'function') origInitGroup.apply(this, arguments)
                vm.syncFilteredGroups()
              }
              vm.syncFilteredGroups = function() {
                if (!vm.allDefaultGroupList && Array.isArray(vm.defaultGroupList)) {
                  vm.allDefaultGroupList = [...vm.defaultGroupList]
                }
                const all = vm.allDefaultGroupList || vm.defaultGroupList || []
                const darkName = vm.$t ? vm.$t('theme.dark') : '暗黑'
                const classicsName = vm.$t ? vm.$t('theme.classics') : '经典'
                const simpleName = vm.$t ? vm.$t('theme.simple') : '朴素'
                if (vm.isDark) {
                  vm.defaultGroupList = all.filter(item => item.name === darkName)
                } else {
                  vm.defaultGroupList = all.filter(item => item.name === classicsName || item.name === simpleName)
                }
                updateAllThemePreviews()
                const available = vm.groupList || vm.defaultGroupList || []
                if (!available.some(item => item.name === vm.activeName)) {
                  vm.activeName = available[0]?.name || ''
                }
              }
              const origChangeTheme = vm.changeTheme
              vm.changeTheme = function(theme, config) {
                const currentBg = window.__currentBackgroundColor || ''
                const customConfig = {
                  ...(config || {}),
                  backgroundColor: currentBg,
                  backgroundImage: 'none',
                  _isCustomTheme: true,
                  _customThemeIsDark: vm.isDark
                }
                if (vm.mindMap && typeof vm.mindMap.setThemeConfig === 'function') {
                  vm.mindMap.setThemeConfig(customConfig)
                }
                if (vm.mindMap && vm.mindMap.el && currentBg) {
                  vm.mindMap.el.style.backgroundColor = currentBg
                  vm.mindMap.el.style.backgroundImage = 'none'
                }
                if (window.$bus) {
                  window.$bus.$emit('marknotepro::custom_theme_chosen', {
                    template: theme.value,
                    isDark: vm.isDark,
                    config: customConfig
                  })
                }
                let res
                if (typeof origChangeTheme === 'function') {
                  res = origChangeTheme.call(this, theme, customConfig)
                }
                if (vm.mindMap && typeof vm.mindMap.setThemeConfig === 'function') {
                  vm.mindMap.setThemeConfig(customConfig)
                }
                if (vm.mindMap && vm.mindMap.el && currentBg) {
                  vm.mindMap.el.style.backgroundColor = currentBg
                  vm.mindMap.el.style.backgroundImage = 'none'
                }
                return res
              }
            }
          },
          mounted() {
            if (this.defaultGroupList !== undefined && typeof this.syncFilteredGroups === 'function') {
              this.syncFilteredGroups()
            }
          },
          watch: {
            isDark() {
              if (this.defaultGroupList !== undefined && typeof this.syncFilteredGroups === 'function') {
                this.$nextTick(() => {
                  this.syncFilteredGroups()
                })
              }
            }
          }
        })
      }
    })()

    if (typeof window.initApp === 'function') {
      const rawInitApp = window.initApp
      window.initApp = function() {
        const app = rawInitApp.apply(this, arguments)
        if (app) window.__vueApp = app
        return app
      }
    }
  </script>
