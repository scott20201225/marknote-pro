      if (themeName) window.currentThemeName = themeName;
      if (colors) window.currentThemeColors = colors;
      const isDarkBool = typeof isDark === 'boolean' ? isDark : false;
      const palette = (window.currentThemeName && ALL_THEME_PALETTES[window.currentThemeName]) || {};
      const c = window.currentThemeColors || {};

      const themeColor = c.themeColor || palette.themeColor || (isDarkBool ? '#409eff' : '#409eff');
      const uiBg = backgroundColor || window.currentBackgroundColor || c.editorBgColor || palette.editorBgColor || (isDarkBool ? '#1a1b26' : '#ffffff');
      const panelBg = c.floatBgColor || palette.floatBgColor || (isDarkBool ? '#24283b' : '#ffffff');
      const sidebarBg = c.sideBarBgColor || palette.sideBarBgColor || (isDarkBool ? '#181822' : '#f5f5f5');
      const panelText = c.editorColor || palette.editorColor || (isDarkBool ? 'rgba(255, 255, 255, 0.9)' : '#333333');

      const panelShadow = isDarkBool ? 'rgba(0, 0, 0, 0.35)' : 'rgba(0, 0, 0, 0.08)';

      const scrollbarThumb = isDarkBool ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.18)';
      const cardBorder = isDarkBool ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.08)';
      const textDisabled = isDarkBool ? 'rgba(255, 255, 255, 0.3)' : 'rgba(0, 0, 0, 0.3)';

      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--mm-theme-color', themeColor);
      rootStyle.setProperty('--mm-ui-bg', uiBg);
      rootStyle.setProperty('--mm-panel-bg', panelBg);
      rootStyle.setProperty('--mm-sidebar-bg', sidebarBg);
      rootStyle.setProperty('--mm-panel-border', panelBorder);
      rootStyle.setProperty('--mm-panel-shadow', panelShadow);

      rootStyle.setProperty('--mm-dropdown-bg', dropdownBg);
      rootStyle.setProperty('--mm-btn-icon-bg', btnIconBg);
      rootStyle.setProperty('--mm-btn-icon-border', btnIconBorder);
      rootStyle.setProperty('--mm-scrollbar-thumb', scrollbarThumb);
      rootStyle.setProperty('--mm-card-border', cardBorder);
      rootStyle.setProperty('--mm-text-disabled', textDisabled);

      document.documentElement.style.backgroundColor = uiBg;
      if (document.body) {
        document.body.style.backgroundColor = uiBg;
      }
      document.documentElement.classList.toggle('isDark', isDarkBool);
      if (document.body) {
        document.body.classList.toggle('isDark', isDarkBool);

      window.currentThemeName = initTheme;
      window.applyHostUITheme(initTheme, isDarkParam, initBg, null);

<body>
  <noscript><strong>We're sorry but thoughts doesn't work properly without JavaScript enabled. Please enable it to continue.</strong></noscript>
  <div id="app"></div>
  <script>
    const normalizeLang = (lang) => {
      if (!lang) return 'zh'
      const l = String(lang).toLowerCase().replace('_', '-')
      if (l === 'zh-cn' || l === 'zh') return 'zh'
      if (l === 'zh-tw' || l === 'zhtw') return 'zhtw'
      if (l.startsWith('en')) return 'en'
      if (l.startsWith('ja')) return 'ja'
      if (l.startsWith('de')) return 'de'
      if (l.startsWith('fr')) return 'fr'
      if (l.startsWith('it')) return 'it'
      if (l.startsWith('ko')) return 'ko'
      if (l.startsWith('es')) return 'es'
      if (l.startsWith('pt')) return 'pt'
      if (l.startsWith('tr')) return 'tr'
      if (l.startsWith('vi')) return 'vi'
      return 'zh'
    }

    const initialUrlParams = new URLSearchParams(window.location.search)
    const initialThemeParam = initialUrlParams.get('theme') || ''
    const initialBgParam = initialUrlParams.get('bg') || ''
    const initialDarkParam = initialUrlParams.get('dark') === '1'
    const initialLangParam = initialUrlParams.get('lang') || 'zh'

    let currentMindMapData = null
    let currentConfig = {}
    let currentLang = normalizeLang(initialLangParam)
    let currentLocalConfig = { isDark: initialDarkParam, enableAi: false }
    let currentMindMapTheme = ''
    let currentBackgroundColor = initialBgParam
    let currentThemeConfig = null
    let currentThemeName = initialThemeParam
    let currentThemeColors = null
    let isCustomTheme = false
    let customThemeIsDark = null
    let lastIsDark = initialDarkParam
    let hasInitedApp = false

      try {

      } catch (_) {}

      const i18n = getAppI18n();
      if (i18n) {
        registerExtraLocales(i18n);
        i18n.locale = mappedLang;
      }
      if (window.$bus) {
        window.$bus.$emit('lang_change', mappedLang);

    function getLocalizedThemeName(value, fallbackName, lang) {
      const loc = normalizeLang(lang || currentLang);
      if (THEME_NAME_LOCALES[value] && THEME_NAME_LOCALES[value][loc]) {
        return THEME_NAME_LOCALES[value][loc];
      }
      if (/^dark(\d*)$/.test(value)) {
        const num = RegExp.$1 || '1';
        if (loc === 'zh' || loc === 'zhtw') {
          return num === '1' && value === 'dark' ? '暗色' : '暗色' + num;
        }
        const p = THEME_PREFIXES.dark[loc] || THEME_PREFIXES.dark.en || 'Dark ';
        return p + num;
      }
      if (/^classic(\d+)$/.test(value)) {
        const num = RegExp.$1;
        if (loc === 'zh') return '脑图经典' + num;
        if (loc === 'zhtw') return '腦圖經典' + num;
        const p = THEME_PREFIXES.classic[loc] || THEME_PREFIXES.classic.en || 'Classic ';
        return p + num;
      }
      return fallbackName;
    }

    const getRootNodeData = (data) => {
      if (!data) return null
      if (data.root) return data.root
      if (data.data) return data
      return null
    }

    const computeContentSignature = (data) => {
      if (!data) return ''
      try {
        const root = getRootNodeData(data)
        let layout = data.layout || ''
        let theme = data.theme || null
        let config = data.config || null
        if (!layout && window.__mindMap && typeof window.__mindMap.getLayout === 'function') {
          layout = window.__mindMap.getLayout()
        }
        if (!theme && window.__mindMap && typeof window.__mindMap.getTheme === 'function') {
          theme = {
            template: window.__mindMap.getTheme(),
            config: typeof window.__mindMap.getCustomThemeConfig === 'function' ? window.__mindMap.getCustomThemeConfig() : {}
          }
        }
        return JSON.stringify({ root, layout, theme, config })
      } catch (e) {
        return ''
      }
    }

    window.__markMindMapAsSaved = (savedData) => {
      lastSavedContentSignature = computeContentSignature(savedData || (window.__mindMap ? window.__mindMap.getData(false) : currentMindMapData))
      if (window.electron && window.electron.ipcRenderer) {
        window.electron.ipcRenderer.send('mt::mindmap::state', { modified: false, isSaved: true })
      }
    }

    const notifyModified = () => {
      if (isInitialLoading) return
      if (notifyModifiedTimer) clearTimeout(notifyModifiedTimer)
      notifyModifiedTimer = setTimeout(() => {
        let currentData = currentMindMapData
        if (window.__mindMap && typeof window.__mindMap.getData === 'function') {
          currentData = window.__mindMap.getData(false)
        }
        const currentSignature = computeContentSignature(currentData)
        if (currentSignature && lastSavedContentSignature && currentSignature === lastSavedContentSignature) {
          return
        }
        if (window.electron && window.electron.ipcRenderer) {
          window.electron.ipcRenderer.send('mt::mindmap::state', { modified: true, isSaved: false })

    const patchMindMap = (mindMap) => {
      if (!mindMap) return
      if (mindMap.constructor && mindMap.constructor.prototype && !mindMap.constructor.__marknotepro_proto_patched) {
        mindMap.constructor.__marknotepro_proto_patched = true
        const protoInitTheme = mindMap.constructor.prototype.initTheme
        mindMap.constructor.prototype.initTheme = function() {
          if (typeof protoInitTheme === 'function') {
            protoInitTheme.apply(this, arguments)
          }
          const bg = currentBackgroundColor || window.__currentBackgroundColor
          if (bg) {
            if (this.themeConfig) this.themeConfig.backgroundColor = bg
            if (this.el) this.el.style.backgroundColor = bg
          }
          if (this.themeConfig) {
            this.themeConfig.backgroundImage = 'none'
            this.themeConfig.backgroundRepeat = 'no-repeat'
          }
          if (this.el) {
            this.el.style.backgroundImage = 'none'
          }
        }
      }
      if (!mindMap.__marknotepro_patched) {
        mindMap.__marknotepro_patched = true
        const origInitTheme = mindMap.initTheme
        mindMap.initTheme = function() {
          if (typeof origInitTheme === 'function') {
            origInitTheme.apply(this, arguments)
          }
          const bg = currentBackgroundColor || window.__currentBackgroundColor
          if (bg) {
            if (this.themeConfig) this.themeConfig.backgroundColor = bg
            if (this.el) this.el.style.backgroundColor = bg
          }
          if (this.themeConfig) {
            this.themeConfig.backgroundImage = 'none'
            this.themeConfig.backgroundRepeat = 'no-repeat'
          }
          if (this.el) {
            this.el.style.backgroundImage = 'none'
          }
        }
      }
      if (mindMap.search && !mindMap.search.__marknotepro_patched) {
        mindMap.search.__marknotepro_patched = true
        const searchPlugin = mindMap.search
        const origSearchNext = searchPlugin.searchNext
        searchPlugin.searchNext = function(callback, index) {
          if (!this.isSearching || !Array.isArray(this.matchNodeList) || this.matchNodeList.length <= 0) return
          if (typeof origSearchNext === 'function') {
            origSearchNext.call(this, callback, index)
          }
          if (typeof this.emitEvent === 'function') {
            this.emitEvent()
          }
        }
        const origReplace = searchPlugin.replace
        searchPlugin.replace = function(replaceText, jumpNext = false) {
          if (replaceText === null || replaceText === undefined || !this.isSearching || !this.matchNodeList || this.matchNodeList.length <= 0) return
          let currentNode = this.matchNodeList[this.currentIndex]
          if (!currentNode && this.matchNodeList.length > 0) {
            this.currentIndex = 0
            currentNode = this.matchNodeList[0]
          }
          if (!currentNode) return

          const uid = (typeof currentNode.getData === 'function' ? currentNode.getData('uid') : null) || currentNode.data?.uid || currentNode.uid
          let nodeInstance = (typeof currentNode.getData === 'function') ? currentNode : (uid ? this.mindMap.renderer.findNodeByUid(uid) : null)

          if (nodeInstance && typeof origReplace === 'function') {
            origReplace.call(this, replaceText, jumpNext)
          } else {
            const text = this.getReplacedText(currentNode, this.searchText, String(replaceText))
            if (currentNode.data) {
              currentNode.data.text = text
            }
            if (nodeInstance) {
              nodeInstance.setText(text, nodeInstance.getData('richText'))
            } else {
              this.mindMap.render()
            }
            this.mindMap.command.addHistory()
            this.mindMap.emit('data_change', this.mindMap.getData())
            this.updateMatchNodeList(this.matchNodeList.filter(n => n !== currentNode))
            if (this.currentIndex > this.matchNodeList.length - 1) {
              this.currentIndex = -1
            } else {
              this.currentIndex--
            }
            this.emitEvent()
          }
        }
      }
    }

        patchMindMap(window.__mindMap)
        const hasTheme = !!currentMindMapTheme && typeof window.__mindMap.setTheme === 'function'
        const hasCustomConfig =
          (!!currentBackgroundColor || !!currentThemeConfig) &&
          typeof window.__mindMap.setThemeConfig === 'function'

        const themeChanged = hasTheme && window.__mindMap.getTheme() !== currentMindMapTheme

        if (themeChanged) {
          window.__mindMap.setTheme(currentMindMapTheme, hasCustomConfig)
        }

        if (hasCustomConfig) {
          const mergedConfig = {
            ...(currentThemeConfig || {}),
            backgroundImage: 'none',
            backgroundRepeat: 'no-repeat'
          }
          if (currentBackgroundColor) {
            mergedConfig.backgroundColor = currentBackgroundColor
          }
          window.__mindMap.setThemeConfig(mergedConfig)
        } else if (themeChanged && typeof window.__mindMap.render === 'function') {
          window.__mindMap.render()
        }

        if (window.__mindMap.el) {
          if (currentBackgroundColor) {
            window.__mindMap.el.style.backgroundColor = currentBackgroundColor
          }
          window.__mindMap.el.style.backgroundImage = 'none'
        }
        if (window.__mindMap.themeConfig) {
          if (currentBackgroundColor) {
            window.__mindMap.themeConfig.backgroundColor = currentBackgroundColor
          }
          window.__mindMap.themeConfig.backgroundImage = 'none'
          window.__mindMap.themeConfig.backgroundRepeat = 'no-repeat'
        }
      }

    window.takeOverAppMethods = {
      getMindMapData: () => {
        return currentMindMapData || DEFAULT_DATA

      saveMindMapData: (data) => {
        try {
          currentMindMapData = data
          if (isCustomTheme && currentMindMapData) {
            if (!currentMindMapData.theme) currentMindMapData.theme = {}
            currentMindMapData.theme._isCustomTheme = true
            currentMindMapData.theme._customThemeIsDark = customThemeIsDark
            if (!currentMindMapData.theme.config) currentMindMapData.theme.config = {}
            currentMindMapData.theme.config._isCustomTheme = true
            currentMindMapData.theme.config._customThemeIsDark = customThemeIsDark
            if (currentBackgroundColor) {
              currentMindMapData.theme.config.backgroundColor = currentBackgroundColor
              currentMindMapData.theme.config.backgroundImage = 'none'
            }
          } else if (!isCustomTheme && currentMindMapData?.theme) {
            delete currentMindMapData.theme._isCustomTheme
            delete currentMindMapData.theme._customThemeIsDark
            if (currentMindMapData.theme.config) {
              delete currentMindMapData.theme.config._isCustomTheme
              delete currentMindMapData.theme.config._customThemeIsDark
            }
          }
          notifyModified()
        } catch (e) {
          console.warn('[MarkNotePro] saveMindMapData error:', e)

      },

      }
    }

    const initOrUpdate = (payload) => {
      if (!payload) return
      if (payload.data) {
        currentMindMapData = payload.data
        lastSavedContentSignature = computeContentSignature(payload.data)
      }
      if (payload.language) {
        switchMindMapLanguage(payload.language);
      }

      const isDarkBool = typeof payload.isDark === 'boolean' ? payload.isDark : false
      lastIsDark = isDarkBool
      currentLocalConfig.isDark = isDarkBool
      applyLocalConfig({ isDark: isDarkBool, enableAi: false })

      if (payload.theme) currentThemeName = payload.theme
      if (payload.colors) currentThemeColors = payload.colors
      applyHostUITheme(payload.theme, isDarkBool, payload.backgroundColor, payload.colors)

      if (payload.backgroundColor) {
        currentBackgroundColor = payload.backgroundColor
        window.__currentBackgroundColor = payload.backgroundColor
        if (typeof window.__updateThemeImages === 'function') {
          window.__updateThemeImages()
        }
      }

      // 检查文件内部是否保存了定制主题信息
      const savedTheme = currentMindMapData?.theme
      const savedIsCustom = !!(savedTheme?._isCustomTheme || savedTheme?.config?._isCustomTheme)
      const savedCustomIsDark = savedTheme?._customThemeIsDark ?? savedTheme?.config?._customThemeIsDark

      if (savedIsCustom && savedCustomIsDark === isDarkBool) {
        // 定制主题存在，且深浅主模式一致 -> 定制主题生效！
        isCustomTheme = true
        customThemeIsDark = savedCustomIsDark

              }
            }
            if (this.$options && (this.$options.name === 'Search' || (this.$options.methods && this.$options.methods.onSearchNext && this.$options.methods.showSearch))) {
              const vm = this
              const origShowSearch = vm.showSearch
              vm.showSearch = () => {
                if (typeof origShowSearch === 'function') origShowSearch.call(vm)
                vm.show = true
                vm.$nextTick(() => {
                  if (vm.$refs.searchInputRef && vm.$refs.searchInputRef.focus) {
                    vm.$refs.searchInputRef.focus()
                    if (vm.$refs.searchInputRef.select) {
                      vm.$refs.searchInputRef.select()
                    }
                  }
                })
              }

              const origClose = vm.close
              vm.close = () => {
                vm.show = false
                vm.showSearchResultList = false
                vm.showSearchInfo = false
                vm.total = 0
                vm.currentIndex = 0
                vm.searchText = ''
                vm.hideReplaceInput()
                if (vm.mindMap && vm.mindMap.search) {
                  vm.mindMap.search.endSearch()
                }
              }

              vm.onSearchResultItemClick = (index) => {
                vm.currentIndex = index + 1
                if (vm.mindMap && vm.mindMap.search) {
                  vm.mindMap.search.jump(index)
                }
              }

              vm.onSearchMatchNodeListChange = (list) => {
                if (!Array.isArray(list)) {
                  vm.searchResultList = []
                  return
                }
                const escapeRegExp = s => (s || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
                const trimmed = (vm.searchText || '').trim()
                const escaped = escapeRegExp(trimmed)
                const reg = escaped ? new RegExp(escaped, 'g') : null

                vm.searchResultList = list.map((item, idx) => {
                  const nodeData = (typeof item.getData === 'function' ? item.getData() : null) || item.data || (item.nodeData && item.nodeData.data) || item || {}
                  let name = nodeData.text || ''
                  const id = nodeData.uid || item.uid || idx
                  if (nodeData.richText) {
                    try {
                      name = (window.__mindMapUtils && window.__mindMapUtils.getTextFromHtml) ? window.__mindMapUtils.getTextFromHtml(name) : name.replace(/<[^>]+>/g, '')
                    } catch (_) {}
                  }
                  const text = reg ? String(name).replace(reg, a => `<span class="match">${a}</span>`) : String(name)
                  return {
                    data: item,
                    id,
                    text,
                    name
                  }
                })
              }
            }
          },
          mounted() {
            if (this.onSearchNext && typeof this.close === 'function') {
              const vm = this
              const handleGlobalKeydown = (e) => {
                if (e.key === 'Escape' || e.keyCode === 27) {
                  if (vm.show) {
                    e.preventDefault()
                    e.stopPropagation()
                    vm.close()
                  }
                }
              }
              window.addEventListener('keydown', handleGlobalKeydown, true)
              this.$once('hook:beforeDestroy', () => {
                window.removeEventListener('keydown', handleGlobalKeydown, true)
              })
            }
            if (this.$options && this.$options.computed && this.$options.computed.triggerList && typeof this.setActiveSidebar === 'function') {
              const vm = this;
              window.__sidebarTriggerComponent = vm;
              const updateActiveSidebarClass = () => {
                if (vm.$el && vm.$el.classList) {
                  if (vm.activeSidebar) {
                    vm.$el.classList.add('hasActive');
                  } else {
                    vm.$el.classList.remove('hasActive');
                  }
                }
              };
              vm.$watch('activeSidebar', updateActiveSidebarClass, { immediate: true });
              vm.$watch('show', () => {
                vm.$nextTick(updateActiveSidebarClass);
              });
              this.$nextTick(() => {
                if (vm._computedWatchers && vm._computedWatchers.triggerList) {
                  vm._computedWatchers.triggerList.dirty = true;
                }
                vm.$forceUpdate();
                updateActiveSidebarClass();
              });
            }
            if (this.defaultGroupList !== undefined && typeof this.syncFilteredGroups === 'function') {
              this.syncFilteredGroups()
            }
          },
          watch: {
            isDark() {
              if (this.defaultGroupList !== undefined && typeof this.syncFilteredGroups === 'function') {
                this.$nextTick(() => {
                  this.syncFilteredGroups()
                })
              }
            }
          }
        })
      }

    if (typeof window.initApp === 'function') {
      const rawInitApp = window.initApp;
      window.initApp = function() {
        const rawRes = rawInitApp.apply(this, arguments);
        const app = rawRes || document.getElementById('app')?.__vue__ || window.__vueApp;
        if (app) {
          window.__vueApp = app;
          if (app.$msgbox) {
            const rawMsgbox = app.$msgbox;
            app.$msgbox = function(opts) {
              if (opts && (
                (typeof opts.title === 'string' && (opts.title.includes('重要提示') || opts.title.includes('试用'))) ||
                (typeof opts.message === 'string' && (opts.message.includes('试用') || opts.message.includes('sxmind')))
              )) {
                return Promise.resolve();
              }
              return rawMsgbox.apply(this, arguments);
            };
          }
        }
        const i18n = getAppI18n();
        if (i18n) {
          window.__vueI18n = i18n;
          registerExtraLocales(i18n);
          const targetLoc = normalizeLang(currentLang);
          i18n.locale = targetLoc;
        }
        setTimeout(() => {
          switchMindMapLanguage(currentLang);
        }, 50);
        setTimeout(() => {
          switchMindMapLanguage(currentLang);
        }, 300);
        return app || rawRes;
      };
    }

    window.__parseMindMapImportData = async function(base64, fileName) {
      try {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const file = new File([bytes], fileName);

        if (/\.(smm|json|mind)$/i.test(fileName)) {
          const text = new TextDecoder('utf-8').decode(bytes);
          return JSON.parse(text);
        }

        if (/\.xmind$/i.test(fileName)) {
          if (window.__mindMapParsers && window.__mindMapParsers.xmind) {
            return await window.__mindMapParsers.xmind.parseXmindFile(file);
          }
        }

        if (/\.md$/i.test(fileName)) {
          const text = new TextDecoder('utf-8').decode(bytes);
          if (window.__mindMapParsers && window.__mindMapParsers.markdown) {
            return window.__mindMapParsers.markdown.transformMarkdownTo(text);
          }
        }
      } catch (err) {
        console.error('__parseMindMapImportData error:', err);
      }
      return null;
    };

    try {
      const params = new URLSearchParams(window.location.search);
      const initTheme = params.get('theme') || '';
      const initDark = params.get('dark') === '1';
      const initBg = params.get('bg') || '';
      if (initTheme || initBg || initDark) {
        applyHostUITheme(initTheme, initDark, initBg, null);
        if (initBg) {
          currentBackgroundColor = initBg;
          window.__currentBackgroundColor = initBg;
          document.documentElement.style.backgroundColor = initBg;
          if (document.body) document.body.style.backgroundColor = initBg;
        }
      } else {
        applyHostUITheme('', false, '', null);
      }
    } catch (_) {}
  </script>
</body>
