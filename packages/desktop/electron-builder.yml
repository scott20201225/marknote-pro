appId: com.scott20201225.marknotepro
productName: MarkNotePro
directories:
  buildResources: build
  output: ../../dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # ================================
  # Do not bundle these files
  # ================================
  - '!node_modules/dragula/resources'
  - '!node_modules/**/*.js.map'
  - '!node_modules/**/*.cjs.map'
  - '!node_modules/**/*.mjs.map'
  - '!node_modules/**/*.ts.map'
  - '!node_modules/@vscode/ripgrep/{jsconfig.json,*.md,LICENSE}'
  - '!node_modules/@vscode/ripgrep/lib/download.js'
  - '!node_modules/@vscode/ripgrep/lib/postinstall.js'
  - '!node_modules/ced/vendor'
  # Large source files
  - '!node_modules/mermaid/dist/mermaid.js'
  - '!node_modules/mermaid/dist/mermaid.min.js'
  - '!node_modules/mermaid/dist/mermaid.esm.min.mjs'
  - '!node_modules/katex/dist/katex.min.js'
  - '!node_modules/katex/dist/katex.mjs'
  # Don't bundle Linux build files
  - '!node_modules/ced/build/Release/compact_enc_det.a'
  - '!node_modules/**/{*.vcxproj,*.vcxproj.filters}'
  - '!node_modules/**/build/Release/{*.lib,*.exp,*.ilk,*.pdb,*.iobj,*.ipdb}'
  - '!node_modules/**/build/Release/obj'
  # Duplicate embedded Git (packaged via extraResources)
  - '!node_modules/dugite/git/**'
  # Do not bundle development related files
  - '!eslint.config.js'
  - '!jsconfig.json'
  - '!docs/*'
extraResources:
  - from: build/icons
    to: icons # ends up at resources/icons/
    filter:
      - '*.ico'
  - from: static
    to: static
    filter:
      - '**/*'
      - '!locales/**/!(*.min).json'
  - from: src/githubDesktop/out
    to: githubDesktop/out
    filter:
      - '**/*'
  - from: src/githubDesktop/upstream/vendor/desktop-trampoline/build/Release
    to: githubDesktop/out/desktop-trampoline
    filter:
      - 'desktop-askpass-trampoline*'
      - 'desktop-credential-helper-trampoline*'
      - 'git-credential-desktop*'
      - 'ssh-wrapper*'
  - from: build/embedded-git
    to: embedded-git
    filter:
      - '**/*'
  # Draw.io Web 编辑器资源随 MarkNotePro 源码维护，和 GitHub Desktop
  # 位于同一 src 层级；发布构建不依赖外部仓库或同级目录。
  - from: src/drawioWebApp/drawio
    to: drawio
    filter:
      - '**/*'
      - '!js/diagramly/**'
      - '!js/grapheditor/**'
      - '!**/*.map'
  - from: src/geoGebraWebApp/webapp
    to: geogebra
    filter:
      - '**/*'
      - '!tablet3d/**'
      - '!web/**'
      - '!webSimple/**'
      - '!dev/**'
      - '!partners/**'
      - '!**/*Test*.html'
      - '!**/*test*.html'
      - '!assess.html'
      - '!bugBisector.html'
      - '!buttons.html'
      - '!coords.json'
      - '!evaluator.html'
      - '!notes-bycs*.html'
      - '!notes-murokdev.html'
      - '!showcase.html'
      - '!web3d/js/properties_keys_!(en*|zh*|de*|es*|fr*|ja*|ko*|nl*|pt*|tr*).js'
  - from: src/mindMapWebApp/mind-map
    to: mindmap
    filter:
      - 'index.html'
      - 'dist/**'
      - '!dist/**/*.map'
npmRebuild: false
electronLanguages: # Keep Chromium/AppKit locales for the UI languages MarkText supports
  # Values must cover both spellings: "xx-YY" .pak files on Windows/Linux and
  # "xx_YY" .lproj bundles on macOS. Keeping them lets OS-provided strings
  # (e.g. the macOS Window management items) localize on non-English systems;
  # the in-built locales are still the source for the app's own UI.
  - en-US
  - en
  - de
  - es
  - fr
  - ja
  - ko
  - nl
  - pt-BR
  - pt-PT
  - pt_BR
  - pt_PT
  - tr
  - zh-CN
  - zh-TW
  - zh_CN
  - zh_TW

asarUnpack:
  - resources/**
protocols:
  - name: GitHub Desktop
    schemes:
      - x-github-client
      - x-github-desktop-dev-auth
      - x-github-desktop-auth
      - github-mac
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: markdown
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mmd
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdown
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdtxt
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdtext
    name: Markdown
    description: Markdown document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: mdx
    name: Markdown
    description: MDX document
    mimeType: text/markdown
    role: Editor
    icon: icons/md.ico
  - ext: drawio
    name: Drawio
    description: Draw.io Diagram
    mimeType: application/vnd.jgraph.mxfile
    role: Editor
    icon: icons/md.ico
  - ext: ggb
    name: GeoGebra
    description: GeoGebra Worksheet
    mimeType: application/vnd.geogebra.file
    role: Editor
    icon: icons/md.ico
  - ext: smm
    name: Simple Mind Map
    description: Simple Mind Map Document
    mimeType: application/json
    role: Editor
    icon: icons/md.ico
win:
  executableName: marknotepro
  artifactName: 'marknotepro-win-${arch}-${version}.${ext}'
  target:
    - target: 'nsis'
    - target: 'zip'
  icon: static/icon.ico
nsis:
  artifactName: 'marknotepro-win-${arch}-${version}-setup.${ext}'
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: windows/installer.nsh
mac:
  artifactName: 'marknotepro-mac-${arch}-${version}.${ext}'
  entitlementsInherit: build/mac/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  icon: static/icon.icns
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: 'marknotepro-mac-${arch}-${version}.${ext}'
  contents:
    - x: 410
      y: 240
      type: 'link'
      path: '/Applications'
    - x: 130
      y: 240
      type: 'file'
linux:
  artifactName: 'marknotepro-linux-${arch}-${version}.${ext}'
  executableName: 'marknotepro'
  description: 'MarkNotePro is a local-first note app for organizing local notes.'
  maintainer: 'ScottCheng'
  category: 'Office;TextEditor;Utility'
  mimeTypes:
    - 'text/markdown'
    - 'text/x-markdown'
    - 'text/plain'
    - 'application/vnd.jgraph.mxfile'
    - 'application/x-drawio'
    - 'application/vnd.geogebra.file'
    - 'application/json'
    - 'application/x-simple-mind-map'
  icon: 'static/icon.png'
  desktop:
    entry:
      StartupWMClass: 'marknotepro'
      Keywords: 'marknotepro;'
  target:
    - snap
    - deb
    - rpm
    - tar.gz
  fileAssociations:
    - ext: 'md'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'markdown'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mmd'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdown'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdtxt'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdtext'
      name: 'Markdown'
      description: 'Markdown document'
    - ext: 'mdx'
      name: 'Markdown'
      description: 'MDX document'
    - ext: 'drawio'
      name: 'Drawio'
      description: 'Draw.io Diagram'
    - ext: 'ggb'
      name: 'GeoGebra'
      description: 'GeoGebra Worksheet'
    - ext: 'smm'
      name: 'Simple Mind Map'
      description: 'Simple Mind Map Document'
